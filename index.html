<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found Pets</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <button onclick="alert('Menu')">☰</button>
    <h1>Lost & Found Pets</h1>
    <button>♧</button>
  </header>

  <main>

    <!-- FEED -->
    <section id="feed" class="page">

      <div class="tabs">
        <button class="active" onclick="filterPets('all', this)">All</button>
        <button onclick="filterPets('lost', this)">Lost</button>
        <button onclick="filterPets('found', this)">Found</button>
      </div>

      <h2>Recently Lost / Found</h2>

      <div id="pets" class="grid"></div>

      <button class="add" onclick="showPage('report')">+</button>

    </section>


    <!-- REPORT -->
    <section id="report" class="page hidden">

      <div class="title">
        <button onclick="showPage('feed')">←</button>
        <h2>Report a Lost or Found Pet</h2>
      </div>

      <form id="petForm">

        <label>Pet Photo</label>

        <label class="upload">
          <span>🖼️</span>
          <b>Tap to upload photo</b>
          <small>or drag and drop</small>
          <input id="photo" type="file" accept="image/*">
        </label>

        <h3>Pet Details</h3>

        <label>Type</label>

        <div class="type">
          <button type="button" class="selected" onclick="setType('lost',this)">Lost</button>
          <button type="button" onclick="setType('found',this)">Found</button>
        </div>

        <label>Pet Name <small>(optional)</small></label>
        <input id="name" placeholder="e.g. Bella">

        <label>Species</label>
        <select id="species">
          <option>Dog</option>
          <option>Cat</option>
          <option>Bird</option>
          <option>Rabbit</option>
          <option>Other</option>
        </select>

        <label>Breed <small>(optional)</small></label>
        <input id="breed" placeholder="e.g. Golden Retriever">

        <label>Color / Markings</label>
        <input id="color" placeholder="e.g. Golden fur, white chest">

        <label>Location</label>
        <input id="location" placeholder="e.g. Central Park, New York" required>

        <label>Date / Time</label>
        <input id="date" type="datetime-local" required>

        <label>Description</label>
        <textarea id="description" placeholder="Add any extra details..."></textarea>

        <h3>Contact Information</h3>

        <label>Your Name</label>
        <input id="contact" placeholder="John Doe" required>

        <label>Phone</label>
        <input id="phone" placeholder="(555) 123-4567" required>

        <label>Email</label>
        <input id="email" type="email" placeholder="john@email.com" required>

        <button class="submit" type="submit">
          Submit Report
        </button>

      </form>

    </section>


    <!-- PROFILE -->
    <section id="profile" class="page hidden">

      <div class="title">
        <button onclick="showPage('feed')">←</button>
        <h2>Pet Profile</h2>
      </div>

      <div id="profileContent"></div>

    </section>

  </main>


  <nav>
    <button class="navActive" onclick="showPage('feed')">
      🏠
      <small>Feed</small>
    </button>

    <button onclick="showPage('report')">
      ⊞
      <small>Report</small>
    </button>

    <button>
      ♙
      <small>Profile</small>
    </button>
  </nav>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
